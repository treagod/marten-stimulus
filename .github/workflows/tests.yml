name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  crystal-spec:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crystal:
          - "1.19"
          - "1.20"
          - "1.21"
          - nightly
    container:
      image: crystallang/crystal:${{ matrix.crystal }}
    steps:
      - uses: actions/checkout@v4
      - name: Install required packages
        run: |
          apt-get update
          apt-get -yqq install libsqlite3-dev
      - name: Cache Crystal
        uses: actions/cache@v4
        with:
          path: ~/.cache/crystal
          key: ${{ runner.os }}-crystal-${{ matrix.crystal }}-${{ hashFiles('shard.lock') }}
          restore-keys: |
            ${{ runner.os }}-crystal-${{ matrix.crystal }}-
      - name: Install shards
        run: shards install --ignore-crystal-version
      - name: Run Crystal specs
        run: crystal spec

  javascript-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run JavaScript tests
        run: npm run test:js
